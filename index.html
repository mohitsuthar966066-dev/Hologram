
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HoloModel 3D Lab</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; background: #030914; color: #63eaff;
  font: 16px Arial, sans-serif; text-align: center;
}
header { padding: 12px; }
h1 { font-size: 26px; margin: 8px; }
p { color: #b8dce8; }
.controls {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 8px; padding: 8px;
}
button, select, input {
  max-width: 95%; padding: 11px; border-radius: 9px;
  color: #63eaff; background: #092238;
  border: 1px solid #38cfee;
}
#view { width: 100%; height: 58vh; min-height: 300px; }
#status { font-size: 13px; padding: 8px; color: #a9d6e5; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<header>
  <h1>HOLOMODEL LAB</h1>
  <p>Interactive 3D Hologram</p>
  <div class="controls">
    <select id="model">
      <option value="crystal">Holographic Crystal</option>
      <option value="planet">Planet</option>
      <option value="atom">Atom Model</option>
      <option value="dna">DNA Helix</option>
    </select>
    <button id="auto">Auto Rotate: ON</button>
    <button id="reset">Reset View</button>
  </div>
  <div class="controls">
    <label>
      Load 3D file
      <input id="file" type="file" accept=".glb,.gltf">
    </label>
  </div>
</header>

<div id="view"></div>
<div id="status">Loading 3D engine...</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  const status = document.getElementById('status');
  const view = document.getElementById('view');

  if (!window.THREE) {
    status.textContent =
      '3D library load nahi hui. Internet check karke Reload karo.';
    return;
  }

  try {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030914);

    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    camera.position.set(0, 0, 6);

    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x030914);
    view.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const light = new THREE.PointLight(0x38ddff, 30);
    light.position.set(3, 4, 5);
    scene.add(light);

    const root = new THREE.Group();
    scene.add(root);

    let autoRotate = true;
    let drag = false, lastX = 0, lastY = 0;
    let pinchDistance = 0;
    let loadedObject = null;

    function material(color, wireframe=false) {
      return new THREE.MeshStandardMaterial({
        color, emissive: color, emissiveIntensity: 0.45,
        wireframe
      });
    }

    function clearRoot() {
      while (root.children.length) {
        const obj = root.children[0];
        root.remove(obj);
        obj.traverse?.(node => {
          node.geometry?.dispose();
          if (Array.isArray(node.material))
            node.material.forEach(m => m.dispose());
          else node.material?.dispose();
        });
      }
      loadedObject = null;
    }

    function addRing(radius, color, rotationX, rotationY=0) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(radius, 0.018, 8, 120),
        new THREE.MeshBasicMaterial({color})
      );
      ring.rotation.set(rotationX, rotationY, 0);
      root.add(ring);
    }

    function sphere(radius, color, x, y, z, wire=false) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(radius, 32, 24),
        material(color, wire)
      );
      mesh.position.set(x,y,z);
      root.add(mesh);
      return mesh;
    }

    function buildModel(type) {
      clearRoot();

      if (type === 'crystal') {
        root.add(new THREE.Mesh(
          new THREE.IcosahedronGeometry(1.35, 2),
          material(0x24dfff, true)
        ));
        addRing(1.8, 0x347aff, 1.1, 0.3);
        addRing(1.55, 0x22eaff, 0.4, 0.8);
      }

      if (type === 'planet') {
        sphere(1.15, 0x1689ff, 0,0,0);
        addRing(1.65, 0x48eeff, 1.15, 0.25);
        addRing(1.8, 0x3155ff, 1.0, -0.3);
      }

      if (type === 'atom') {
        sphere(0.3, 0xff4a9b, 0,0,0);
        addRing(1.35, 0x31eaff, 0.4, 0.1);
        addRing(1.35, 0xff65c5, 1.4, 0.7);
        addRing(1.35, 0x4d82ff, 0.8, 1.4);
        sphere(0.12, 0xffffff, 1.1,0.2,0);
      }

      if (type === 'dna') {
        for (let i=0; i<42; i++) {
          const t = i * 0.19;
          const y = (i-20.5) * 0.075;
          const x1 = Math.cos(t)*0.65;
          const z1 = Math.sin(t)*0.65;
          const x2 = -x1, z2 = -z1;
          sphere(0.065, 0x31eaff, x1,y,z1);
          sphere(0.065, 0xff5bc8, x2,y,z2);

          if (i % 3 === 0) {
            const points = [
              new THREE.Vector3(x1,y,z1),
              new THREE.Vector3(x2,y,z2)
            ];
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            root.add(new THREE.Line(geo,
              new THREE.LineBasicMaterial({color:0x588dff})));
          }
        }
      }
    }

    function resize() {
      const w = view.clientWidth || innerWidth;
      const h = view.clientHeight || 350;
      camera.aspect = w/h;
      camera.updateProjectionMatrix();
      renderer.setSize(w,h);
    }
    addEventListener('resize', resize);
    resize();

    view.addEventListener('pointerdown', e => {
      drag = true; lastX=e.clientX; lastY=e.clientY;
      view.setPointerCapture(e.pointerId);
    });
    view.addEventListener('pointermove', e => {
      if (!drag) return;
      root.rotation.y += (e.clientX-lastX)*0.008;
      root.rotation.x += (e.clientY-lastY)*0.008;
      lastX=e.clientX; lastY=e.clientY;
    });
    view.addEventListener('pointerup', () => drag=false);
    view.addEventListener('pointercancel', () => drag=false);
    view.addEventListener('wheel', e => {
      camera.position.z = Math.max(2.5, Math.min(12,
        camera.position.z + e.deltaY*0.008));
    }, {passive:true});

    // Two-finger pinch zoom for touchscreens.
    view.addEventListener('touchmove', e => {
      if (e.touches.length !== 2) return;
      e.preventDefault();
      const dx = e.touches[0].clientX-e.touches[1].clientX;
      const dy = e.touches[0].clientY-e.touches[1].clientY;
      const d = Math.hypot(dx,dy);
      if (pinchDistance) {
        camera.position.z = Math.max(2.5, Math.min(12,
          camera.position.z + (pinchDistance-d)*0.012));
      }
      pinchDistance = d;
    }, {passive:false});
    view.addEventListener('touchend', () => pinchDistance=0);

    document.getElementById('model').onchange = e =>
      buildModel(e.target.value);

    document.getElementById('auto').onclick = e => {
      autoRotate = !autoRotate;
      e.target.textContent = 'Auto Rotate: ' +
        (autoRotate ? 'ON' : 'OFF');
    };

    document.getElementById('reset').onclick = () => {
      camera.position.set(0,0,6);
      root.rotation.set(0,0,0);
    };

    // Load GLB/GLTF files using the official Three.js loader.
    document.getElementById('file').onchange = async e => {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.name.toLowerCase().endsWith('.glb')) {
        status.textContent =
          'Is simple uploader mein .glb file use karo. GLTF files ke external assets ko saath load karna hota hai.';
        return;
      }
      status.textContent = '3D file load ho rahi hai...';
      try {
        const mod = await import(
          'https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js'
        );
        const loader = new mod.GLTFLoader();
        const url = URL.createObjectURL(file);
        loader.load(url, gltf => {
          clearRoot();
          loadedObject = gltf.scene;
          root.add(loadedObject);
          URL.revokeObjectURL(url);
          status.textContent = '3D project loaded successfully!';
        }, undefined, err => {
          URL.revokeObjectURL(url);
          status.textContent = 'File load nahi hui. Valid GLB file try karo.';
          console.error(err);
        });
      } catch (err) {
        status.textContent = '3D loader download nahi hua. Internet check karo.';
        console.error(err);
      }
    };

    buildModel('crystal');
    status.textContent = '3D Lab ready! Model drag karke rotate karo.';
    function animate() {
      requestAnimationFrame(animate);
      if (autoRotate && !drag) root.rotation.y += 0.004;
      renderer.render(scene,camera);
    }
    animate();
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    console.error(err);
  }
})();
</script>
</body>
        </html>
